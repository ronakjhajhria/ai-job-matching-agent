version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${JOBMIND_POSTGRES_DB:-jobmind}
      POSTGRES_USER: ${JOBMIND_POSTGRES_USER:-jobmind}
      POSTGRES_PASSWORD: ${JOBMIND_POSTGRES_PASSWORD:-jobmind}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JOBMIND_POSTGRES_USER:-jobmind} -d ${JOBMIND_POSTGRES_DB:-jobmind}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Qdrant URL to point to the Docker service
      JOBMIND_QDRANT_URL: "http://qdrant:6333"
      JOBMIND_DATABASE_URL: "postgresql+psycopg://${JOBMIND_POSTGRES_USER:-jobmind}:${JOBMIND_POSTGRES_PASSWORD:-jobmind}@postgres:5432/${JOBMIND_POSTGRES_DB:-jobmind}"
      JOBMIND_REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
