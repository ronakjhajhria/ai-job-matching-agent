version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override Qdrant URL to point to the Docker service
      JOBMIND_QDRANT_URL: "http://qdrant:6333"
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
