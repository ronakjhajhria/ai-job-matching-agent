[project]
name = "jobmind"
version = "0.1.0"
description = "JobMind - AI-powered career intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.3",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "qdrant-client>=1.7.0",
    "langgraph>=0.0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
